function firstOf(p){var r=D.periods[p].rows;return r.length?r[0][0]:''}
function hashFor(v,s){if(v==='saved')return '#saved'+(s?'/'+s:'');if(!s)return '#'+v;if(v==='daily')return '#'+s;return '#'+v+'/'+s}
function parse(){var h=decodeURIComponent(location.hash.slice(1));if(!h)return {view:'daily',slug:'',open:false};
 var p=h.split('/');if(D.periods[p[0]]||p[0]==='saved'){var s=p.slice(1).join('/');return {view:p[0],slug:s,open:!!s}}
 if(p.length>=2)return {view:'daily',slug:h,open:true};return null}
function nav(v,s){var h=hashFor(v,s);if(location.hash===h)apply(v,s,false,!!s);else location.hash=h}
function go(i){if(!figs.length||i<0||i>=N)return;n=i;figs.forEach(function(f,k){f.classList.toggle('on',k===n)});ticks.forEach(function(t,k){t.classList.toggle('on',k===n)});
 $('ttl').textContent=figs[n].dataset.t;$('sub').textContent=figs[n].dataset.s;$('cur').textContent=n+1;
 $('pv').classList.toggle('off',n===0);$('nx').classList.toggle('off',n===N-1);
 $('pvn').textContent=n>0?figs[n-1].dataset.t:'';$('nxn').textContent=n<N-1?figs[n+1].dataset.t:'';
 document.title='트렌딩 — '+repo(st.slug).name+' 그림 '+(n+1)+'/7';}
function tags(s){var t='';if(bm.indexOf(s)>=0)t+=' · <em class="tg">저장됨</em>';if(gh.indexOf(s)>=0)t+=' · <em class="tg">GitHub에 저장됨</em>';return t}
function metaOf(R,k){var a=[];if(R.lang)a.push(esc(R.lang));if(R.stars)a.push(esc(R.stars));if(k&&k.move)a.push(esc(k.move));if(R.gone)a.push('지금 목록에 없음');return a.join(' · ')}
function renderList(){var P=D.periods[st.period],saved=st.view==='saved',ids=saved?bm.slice():P.rows.map(function(r){return r[0]});
 if(!ids.length){list.innerHTML='<p class="empty">'+(saved?'아직 저장한 저장소가 없습니다.':esc(P.err||'공식 트렌딩을 불러오지 못했습니다.'))+'</p>';return}
 list.innerHTML=ids.map(function(s){var R=repo(s),k=rank(st.period,s),on=s===st.slug;
  return '<a class="row'+(k&&k.i===0?' top':'')+(on?' sel':'')+'" href="'+hashFor(st.view,s)+'" data-r="'+esc(s)+'"'+(on?' aria-current="true"':'')+'><div class="num">'+(k?pad(k.i):'–')+'</div>'+
   '<div class="body"><h2><span class="own">'+esc(R.owner)+' /</span> '+esc(R.name)+'</h2>'+(R.desc?'<p title="'+esc(R.desc)+'">'+esc(R.desc)+'</p>':'<p class="no">설명 없음</p>')+'<div class="meta">'+metaOf(R,k)+tags(s)+'</div></div>'+
   '<div class="delta">'+(k&&k.gain?'<b>'+k.gain+'</b><small>'+P.label+'</small>':'')+'</div></a>'}).join('');
 [].forEach.call(list.querySelectorAll('.row'),function(r){r.onclick=function(e){e.preventDefault();fromList=true;nav(st.view,r.dataset.r)}})}
function savedTarget(){return bm.indexOf(st.slug)>=0?st.slug:(bm[0]||'')}
function renderTabs(){[].forEach.call(document.querySelectorAll('.tabs a'),function(a){var v=a.dataset.v,on=v===st.view;
  a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  a.setAttribute('href',mq.matches?'#'+v:(v==='saved'?hashFor('saved',savedTarget()):hashFor(v,rank(v,st.slug)?st.slug:'')))});
 var c=$('cnt');c.textContent=bm.length?bm.length:'';c.hidden=!bm.length;$('date').textContent=D.periods[st.period].date}
function renderPanel(){var A=$('aside');if(!st.slug){A.hidden=true;return}A.hidden=false;
 var R=repo(st.slug),P=D.periods[st.period],k=rank(st.period,st.slug);
 $('kick').textContent=(k?pad(k.i):'–')+' · 보는 중';$('nm').textContent=R.name;$('nm').classList.toggle('long',R.name.length>13);
 var ds=$('ds');ds.textContent=R.desc||'설명 없음';ds.classList.toggle('no',!R.desc);
 var m=[];if(R.lang)m.push(esc(R.lang));if(k&&k.gain)m.push(P.label+' <b>'+k.gain+'</b>');else if(R.stars)m.push(esc(R.stars));$('mt').innerHTML=m.join(' · ');
 var src=$('src');src.href='https://github.com/'+R.owner+'/'+R.name;src.setAttribute('aria-label','원본 저장소 '+R.owner+'/'+R.name+' (새 탭)');
 var b=bm.indexOf(st.slug)>=0,g=gh.indexOf(st.slug)>=0;
 $('bm').setAttribute('aria-pressed',b);$('bm').querySelector('.l').textContent=b?'저장됨':'북마크';
 $('gh').setAttribute('aria-pressed',g);$('gh').querySelector('.l').textContent=g?'GitHub에 저장됨':'GitHub에 저장'}
function showSet(s,i){var R=repo(s),cat=R.cat&&sets[R.cat]?R.cat:null,F=$('fg');
 Object.keys(sets).forEach(function(k){var x=sets[k];x.classList.toggle('on',k===cat);[].forEach.call(x.querySelectorAll('.fig'),function(f){f.classList.remove('on')})});
 F.classList.toggle('nofig',!cat);
 if(!cat){figs=[];$('ttl').textContent='설명 그림';$('sub').textContent='아직 없음';
  var ds=$('ds'),cut=!!R.desc&&ds.scrollHeight>ds.clientHeight+1;$('bq').textContent=cut?R.desc:'';$('full').classList.toggle('on',cut);
  document.title='트렌딩 — '+R.name;return}
 figs=[].slice.call(sets[cat].querySelectorAll('.fig'));ticks.forEach(function(t,k){t.setAttribute('aria-label','그림 '+(k+1)+': '+figs[k].dataset.t)});go(i)}
function apply(v,s,keep,open){if(v!=='saved'&&!D.periods[v])v='daily';
 if(v==='saved'){if(!s||bm.indexOf(s)<0)s=savedTarget()}else{st.period=v;if(!s)s=rank(v,st.slug)&&!mq.matches?st.slug:firstOf(v)}
 st.view=v;var same=s===st.slug;st.slug=s;
 B.classList.toggle('detail',!!(open&&s));renderTabs();renderList();renderPanel();if(s)showSet(s,same&&keep?n:0);
 if(open&&mq.matches)window.scrollTo(0,0)}
function close(){if(fromList&&history.length>1){fromList=false;history.back()}else nav(st.view,'')}
function toggle(arr,key){var i=arr.indexOf(st.slug);if(i>=0)arr.splice(i,1);else arr.unshift(st.slug);store(key,arr);renderTabs();renderList();renderPanel()}
$('bm').onclick=function(){toggle(bm,KB)};$('gh').onclick=function(){toggle(gh,KG)};$('back').onclick=close;
[].forEach.call(document.querySelectorAll('.tabs a'),function(a){a.onclick=function(e){e.preventDefault();var v=a.dataset.v;
 if(mq.matches)nav(v,'');else nav(v,v==='saved'?savedTarget():(rank(v,st.slug)?st.slug:firstOf(v)))}});
$('pv').onclick=function(){go(n-1)};$('nx').onclick=function(){go(n+1)};
ticks.forEach(function(t,k){t.onclick=function(){go(k)}});
document.addEventListener('keydown',function(e){if(e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='Escape'&&B.classList.contains('detail')&&mq.matches){close();return}
 if(e.key==='ArrowRight')go(n+1);if(e.key==='ArrowLeft')go(n-1)});
window.addEventListener('hashchange',function(){var p=parse();if(p)apply(p.view,p.slug,true,p.open)});
window.addEventListener('storage',function(e){if(e.key===KB||e.key===KG){bm=load(KB);gh=load(KG);renderTabs();renderList();renderPanel()}});
(mq.addEventListener?mq.addEventListener('change',function(){renderTabs()}):0);
var p0=parse()||{view:'daily',slug:'',open:false};apply(p0.view,p0.slug,true,p0.open);})();</script></body></html>
